apiVersion: v1
kind: Namespace
metadata:
  name: impala-analyzer
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: impala-analyzer-data
  namespace: impala-analyzer
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: impala-analyzer
  namespace: impala-analyzer
spec:
  replicas: 1                # jangan dinaikkan: scheduler sync berjalan di dalam proses
  strategy:
    type: Recreate           # PVC ReadWriteOnce: pod lama harus berhenti dulu
  selector:
    matchLabels: { app: impala-analyzer }
  template:
    metadata:
      labels: { app: impala-analyzer }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: app
          image: storage.zilog.zil:5000/impala-analyzer:1.0.0
          ports:
            - containerPort: 3000
          env:
            - { name: DATA_DIR, value: /data }
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            httpGet: { path: /api/status, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/status, port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 2Gi }   # upload zip besar diproses di memori
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: impala-analyzer-data
---
apiVersion: v1
kind: Service
metadata:
  name: impala-analyzer
  namespace: impala-analyzer
spec:
  selector: { app: impala-analyzer }
  ports:
    - { port: 80, targetPort: 3000 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: impala-analyzer
  namespace: impala-analyzer
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"     # batas upload ZIP
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
    - host: impala-analyzer.apps.zilog.zil
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: impala-analyzer
                port: { number: 80 }